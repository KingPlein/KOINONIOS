name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: syntrophe
        run: flutter pub get

      - name: Run build_runner
        working-directory: syntrophe
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: syntrophe
        run: flutter build apk --release

      - name: Build AppBundle (AAB)
        working-directory: syntrophe
        run: flutter build appbundle --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: syntrophe-release-apk
          path: syntrophe/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: syntrophe-release-aab
          path: syntrophe/build/app/outputs/bundle/release/app-release.aab
