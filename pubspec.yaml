name: syntrophe
description: "Syntrophe - Bible Study Partner App. Growing together in the Word."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # BLoC Pattern
  flutter_bloc: ^8.1.3

  # Local Database
  sqflite: ^2.3.0
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18

  # Local Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Video Player
  video_player: ^2.8.2
  chewie: ^1.7.4
  youtube_player_flutter: ^8.1.2

  # Audio Player
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Speech to Text
  speech_to_text: ^6.6.0

  # Notifications & Alarms
  flutter_local_notifications: ^16.3.2
  android_alarm_manager_plus: ^3.0.4

  # HTTP Client
  dio: ^5.4.0
  retrofit: ^4.0.3

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Utilities
  uuid: ^4.3.3
  intl: ^0.18.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  record: ^5.0.4
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.1
  markdown: ^7.2.1
  flutter_markdown: ^0.6.18

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Firebase (Optional)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  drift_dev: ^2.15.0
  injectable_generator: ^2.4.1
  retrofit_generator: ^8.0.6
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/
  
  fonts:
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/CrimsonText-Regular.ttf
        - asset: assets/fonts/CrimsonText-Bold.ttf
          weight: 700
        - asset: assets/fonts/CrimsonText-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
